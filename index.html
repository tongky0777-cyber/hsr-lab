<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>황서린 코치의 퍼스널 트레이닝 랩</title>
<style>
  /* ===== 브랜드 색/토큰 (나중에 로고·색 교체 쉽게 변수화) ===== */
  :root{
    --brand-primary:#FF6A1A;      /* 오렌지 */
    --brand-primary-dark:#E2540A;
    --brand-accent:#B7E400;       /* 라임 */
    --brand-accent-dark:#93B900;
    --brand-name:"황서린";

    --bg:#0f1115;
    --bg-soft:#171a21;
    --card:#1d212b;
    --card-2:#232836;
    --line:#2c3240;
    --text:#f2f4f8;
    --text-dim:#9aa4b5;
    --text-mute:#6b7484;
    --danger:#ff5470;
    --ok:#37d67a;

    --radius:16px;
    --radius-sm:10px;
    --shadow:0 8px 30px rgba(0,0,0,.35);
    --sidebar-w:230px;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",'Segoe UI',Roboto,sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;}
  body{min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:var(--brand-accent);}

  /* ===== 레이아웃 ===== */
  /* 레이아웃 */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
    background:linear-gradient(180deg,#12141a 0%,#0d0f14 100%);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:50;
  }
  .sidebar-title{padding:20px 18px 8px;font-size:10.5px;letter-spacing:1.5px;color:var(--text-mute);font-weight:800;}

  /* 본문 상단 브랜드 헤더 — 사이드바 바로 오른쪽, 본문이 시작하는 곳 */
  .page-brand{
    display:flex;align-items:center;gap:13px;padding:18px 32px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,106,26,.06),transparent);
  }
  .pb-logo{
    width:46px;height:46px;border-radius:13px;flex:0 0 46px;
    background:linear-gradient(135deg,var(--brand-primary),var(--brand-accent));
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(255,106,26,.42);
  }
  .pb-logo svg{width:26px;height:26px;}
  .pb-txt .brand-pre{font-size:12px;color:var(--text-dim);font-weight:600;letter-spacing:.3px;display:block;margin-bottom:2px;}
  .pb-txt .brand-name{
    font-size:20px;font-weight:900;letter-spacing:-.6px;line-height:1.15;word-break:keep-all;
    background:linear-gradient(92deg,var(--brand-primary),var(--brand-accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  }
  .nav{padding:8px;display:flex;flex-direction:column;gap:4px;flex:1;overflow:auto;}
  .nav button{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:transparent;border:0;color:var(--text-dim);
    padding:12px 14px;border-radius:12px;font-size:14.5px;font-weight:600;transition:.15s;
  }
  .nav button .ic{font-size:18px;width:22px;text-align:center;}
  .nav button:hover{background:var(--card);color:var(--text);}
  .nav button.active{background:linear-gradient(135deg,rgba(255,106,26,.18),rgba(183,228,0,.12));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,106,26,.35);}
  .nav .cnt{margin-left:auto;font-size:11px;background:var(--card-2);color:var(--text-dim);padding:1px 8px;border-radius:20px;}
  .sidebar-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--text-mute);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:var(--sidebar-w);}
  .content{padding:28px 32px 90px;max-width:1000px;width:100%;margin:0 auto;}

  h1.page-title{font-size:24px;margin:0 0 4px;letter-spacing:-.5px;}
  .page-sub{color:var(--text-dim);font-size:13.5px;margin:0 0 22px;}

  /* ===== 카드/폼 공통 ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
  .card + .card{margin-top:18px;}
  .card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px;}
  .grid{display:grid;gap:14px;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:1fr 1fr 1fr;}
  label.fld{display:block;font-size:12.5px;color:var(--text-dim);margin:0 0 6px;font-weight:600;}
  input[type=text],input[type=number],select,textarea{
    width:100%;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);
    padding:11px 12px;border-radius:var(--radius-sm);font-size:14px;outline:none;transition:.15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--brand-primary);box-shadow:0 0 0 3px rgba(255,106,26,.15);}
  textarea{resize:vertical;min-height:70px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg-soft);
    color:var(--text-dim);font-size:13px;font-weight:600;transition:.15s;user-select:none;
  }
  .chip.on{background:var(--brand-primary);border-color:var(--brand-primary);color:#fff;}
  .chip.on.lime{background:var(--brand-accent);border-color:var(--brand-accent);color:#14210a;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:0;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:700;transition:.15s;
  }
  .btn-primary{background:linear-gradient(135deg,var(--brand-primary),var(--brand-primary-dark));color:#fff;box-shadow:0 6px 18px rgba(255,106,26,.3);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-lime{background:var(--brand-accent);color:#14210a;}
  .btn-ghost{background:var(--card-2);color:var(--text);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--line);}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn-sm{padding:8px 12px;font-size:12.5px;border-radius:9px;}
  .btn-block{width:100%;}
  .row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

  .empty{text-align:center;padding:40px 16px;color:var(--text-mute);}
  .empty .big{font-size:34px;margin-bottom:10px;}

  /* 고객 목록 */
  .client-list{display:grid;gap:10px;}
  .client-item{display:flex;align-items:center;gap:14px;background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;padding:13px 14px;}
  .avatar{width:40px;height:40px;border-radius:50%;flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#111;background:linear-gradient(135deg,var(--brand-accent),var(--brand-primary));}
  .client-meta b{font-size:14.5px;}
  .client-meta small{color:var(--text-dim);font-size:12.5px;margin-left:10px;}
  .client-item .sp{margin-left:auto;display:flex;gap:8px;}

  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:var(--card-2);color:var(--text-dim);border:1px solid var(--line);}

  /* 선택 바 (공유 고객) */
  .clientbar{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(255,106,26,.1),rgba(183,228,0,.08));border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:18px;}
  .clientbar .avatar{width:34px;height:34px;flex-basis:34px;font-size:13px;}
  .clientbar select{max-width:260px;}

  /* 결과 출력 */
  .result{background:var(--bg-soft);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px;}
  .week-block{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;}
  .week-head{background:var(--card-2);padding:11px 14px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:10px;}
  .week-head .tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:rgba(183,228,0,.18);color:var(--brand-accent);}
  table.prog{width:100%;border-collapse:collapse;font-size:13px;}
  table.prog th,table.prog td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);}
  table.prog th{color:var(--text-dim);font-weight:600;font-size:11.5px;background:rgba(255,255,255,.02);}
  table.prog td.c{text-align:center;white-space:nowrap;}
  .daychip{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--brand-primary);color:#fff;font-weight:700;}

  .out-block{margin-bottom:16px;}
  .out-block .lab{font-size:12px;font-weight:800;color:var(--brand-accent);letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .out-body{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-size:14px;line-height:1.7;white-space:pre-wrap;position:relative;}
  .copybtn{position:absolute;top:8px;right:8px;}
  .hashline{color:var(--brand-accent);font-weight:600;}

  .disclaimer{margin-top:16px;font-size:11.5px;color:var(--text-mute);background:rgba(255,84,112,.07);border:1px solid rgba(255,84,112,.25);border-radius:10px;padding:11px 13px;line-height:1.55;}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--brand-accent);color:#14210a;font-weight:800;padding:11px 20px;border-radius:30px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:99;}
  .toast.show{opacity:1;bottom:96px;}

  /* 모달 */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:80;padding:16px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:440px;box-shadow:var(--shadow);max-height:90vh;overflow:auto;}
  .modal h3{margin:0 0 16px;font-size:17px;}

  .hidden{display:none !important;}

  /* ===== 모바일: 사이드바를 가로 스크롤 탭으로, 브랜드 헤더는 본문 위 ===== */
  @media (max-width:820px){
    .app{flex-direction:column;}
    .sidebar{position:static;width:auto;flex:none;height:auto;flex-direction:row;
      border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;}
    .sidebar-title,.sidebar-foot{display:none;}
    .nav{flex-direction:row;padding:8px;gap:6px;overflow:visible;}
    .nav button{white-space:nowrap;padding:9px 14px;}
    .main{margin-left:0;}
    .page-brand{padding:14px 16px;}
    .pb-logo{width:40px;height:40px;flex-basis:40px;}
    .pb-logo svg{width:23px;height:23px;}
    .pb-txt .brand-name{font-size:17px;}
    .content{padding:18px 15px 40px;}
    .g2,.g3{grid-template-columns:1fr;}
    .clientbar select{max-width:none;flex:1;}
  }

  /* ===== 콘텐츠 캘린더 ===== */
  table.cal{width:100%;border-collapse:collapse;font-size:13px;}
  table.cal th,table.cal td{padding:9px 11px;border-top:1px solid var(--line);text-align:left;vertical-align:top;}
  table.cal th{color:var(--text-dim);font-size:11.5px;background:rgba(255,255,255,.02);}
  table.cal td.day{font-weight:800;color:var(--brand-accent);white-space:nowrap;}
  .fmt{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--card-2);color:var(--text-dim);border:1px solid var(--line);white-space:nowrap;}
  .cal-use{font-size:11px;color:var(--brand-primary);cursor:pointer;background:none;border:0;padding:0;text-decoration:underline;white-space:nowrap;}

  /* ===== FAQ 챗봇 ===== */
  .chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:6px 2px;}
  .msg{max-width:84%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;}
  .msg.bot{align-self:flex-start;background:var(--card-2);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--brand-primary),var(--brand-primary-dark));color:#fff;border-bottom-right-radius:4px;}
  .chat-in{display:flex;gap:8px;margin-top:12px;}
  .chat-in input{flex:1;}
  .qbtns{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
  .qbtn{font-size:12.5px;padding:7px 12px;border-radius:18px;border:1px solid var(--line);background:var(--bg-soft);color:var(--text-dim);}
  .qbtn:hover{border-color:var(--brand-primary);color:#fff;}

  /* ===== 프로그램 편집 ===== */
  .edweek{border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;margin-bottom:14px;background:var(--bg-soft);}
  .edweek-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .edday{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;}
  .edday-h{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .edrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .edrow input{font-size:13px;padding:8px 9px;}
  .edrow .btn,.edday-h .btn{flex:0 0 auto;}

  /* ===== 사진 그리드 (식단·피드백) ===== */
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
  .photo-item{background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .photo-item img{width:100%;height:120px;object-fit:cover;display:block;cursor:pointer;}
  .photo-cap{font-size:11px;color:var(--text-dim);padding:6px 8px;}
  input[type=file]{width:100%;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);padding:9px;border-radius:10px;font-size:13px;}
  .fbitem{background:var(--bg-soft);border-left:3px solid var(--brand-primary);border-radius:0 10px 10px 0;padding:11px 13px;margin-bottom:10px;}
  .fbitem .t{font-size:13.5px;line-height:1.6;white-space:pre-wrap;}
  .fbitem img{max-width:180px;border-radius:8px;margin-top:8px;display:block;cursor:pointer;}
  .fbitem .m{font-size:11px;color:var(--text-mute);margin-bottom:5px;display:flex;align-items:center;gap:8px;}

  /* ===== 코치 앱 잠금(비밀번호) ===== */
  .lockscreen{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#12141a,#0b0d11);display:flex;align-items:center;justify-content:center;padding:20px;}
  .lockbox{width:100%;max-width:360px;text-align:center;}
  .lock-logo{width:60px;height:60px;border-radius:16px;margin:0 auto 18px;background:linear-gradient(135deg,var(--brand-primary),var(--brand-accent));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(255,106,26,.45);}
  .lock-logo svg{width:34px;height:34px;}
  .lockbox h2{font-size:19px;font-weight:900;letter-spacing:-.4px;margin-bottom:6px;}
  .lockbox p{color:var(--text-dim);font-size:13.5px;margin-bottom:20px;}
  .lockbox input{width:100%;text-align:center;font-size:16px;padding:13px;margin-bottom:12px;}
  .lockbox .btn{width:100%;}
  #lockErr{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px;}

  /* ===== 인쇄(PDF 저장) — 한 페이지에 한 주, Day는 박스로 ===== */
  @media print{
    @page{ margin:12mm; }
    :root{--bg:#fff;--text:#111;}
    body{background:#fff;color:#111;}
    .sidebar,.page-brand,.clientbar,.row-actions,.no-print,#doneStatus{display:none !important;}
    .main{margin-left:0 !important;}
    .main,.content{padding:0;max-width:none;}
    .card{box-shadow:none;border:0;}
    .result,.card{background:#fff !important;color:#111 !important;border:0 !important;padding:0 !important;}
    /* 한 주 = 한 페이지 */
    .week-block{page-break-before:always;break-before:page;border:0 !important;padding:0 !important;margin:0 0 4px !important;}
    .week-block:first-of-type{page-break-before:avoid;break-before:avoid;}
    .week-head{background:#fff5ef !important;color:#111 !important;border:1px solid #ffd9c2 !important;border-radius:8px;padding:8px 12px !important;margin-bottom:10px;font-size:13px;}
    /* Day 박스 그리드 */
    .week-days{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .day-block{page-break-inside:avoid;break-inside:avoid;border:1px solid #ccc !important;border-radius:10px;padding:8px 10px !important;background:#fff !important;}
    .day-block .daychip{color:#fff !important;background:#FF6A1A !important;}
    table.prog{font-size:10px;}
    table.prog th,table.prog td{padding:4px 6px;border-top:1px solid #e6e6e6 !important;}
    table.prog th{color:#666 !important;background:#f7f7f7 !important;}
    .pill{border:1px solid #ddd !important;color:#555 !important;background:#f4f4f4 !important;}
    .print-only{display:block !important;}
    .tag{color:#111 !important;background:#eee !important;}
    a{color:#111;}
  }
  .print-only{display:none;}
  .print-head{margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--brand-primary);}
  .print-head b{font-size:20px;}
</style>
<!-- Firebase (선택): 고객 포털 공유용. 설정 안 하면 이 브라우저에만 저장돼요. -->
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-title">메뉴</div>
    <nav class="nav" id="navDesktop"></nav>
    <div class="sidebar-foot"><span id="footUser"></span>v1.0 &nbsp;<a href="#" id="logoutLink" onclick="logout();return false;" style="color:var(--brand-accent);display:none;">로그아웃</a></div>
  </aside>
  <div class="main">
    <!-- 본문 상단 브랜드 헤더 (사이드바 오른쪽, 본문 시작점) -->
    <header class="page-brand">
      <div class="pb-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z" fill="#14210a"/></svg>
      </div>
      <div class="pb-txt">
        <span class="brand-pre" id="brandPre">황서린 코치의</span>
        <b class="brand-name" id="brandName">퍼스널 트레이닝 랩</b>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- 고객 등록/수정 모달 -->
<div class="modal-bg" id="clientModal">
  <div class="modal">
    <h3 id="cmTitle">고객 등록</h3>
    <input type="hidden" id="cmId" />
    <div class="grid g2">
      <div><label class="fld">이름 *</label><input type="text" id="cmName" placeholder="예) 김지은" /></div>
      <div><label class="fld">나이</label><input type="number" id="cmAge" placeholder="예) 32" /></div>
    </div>
    <div class="grid g2" style="margin-top:12px;">
      <div>
        <label class="fld">성별</label>
        <select id="cmSex"><option value="여성">여성</option><option value="남성">남성</option><option value="기타">기타</option></select>
      </div>
      <div>
        <label class="fld">주 목표</label>
        <select id="cmGoal">
          <option value="근성장">근성장 (근육/볼륨업)</option>
          <option value="다이어트">다이어트 (체지방 감소)</option>
          <option value="체형교정">체형교정 / 자세</option>
          <option value="근력">근력 향상</option>
          <option value="기초체력">기초체력 / 입문</option>
        </select>
      </div>
    </div>
    <div style="margin-top:12px;">
      <label class="fld">운동 수준</label>
      <select id="cmLevel"><option value="초급">초급 (0~6개월)</option><option value="중급">중급 (6개월~2년)</option><option value="고급">고급 (2년+)</option></select>
    </div>

      <button class="btn btn-primary" onclick="saveClient()">저장</button>

<!-- 진행 기록 모달 -->
<div class="modal-bg" id="recModal">

    <div class="grid g2">
      <div><label class="fld">날짜/시점</label><input type="text" id="rcDate" placeholder="예) 3주차 / 3월 2일" /></div>

      <textarea id="rcText" placeholder="예) 체중 -1.2kg, 스쿼트 40kg 성공! 자세 많이 좋아졌어요"></textarea></div>

<!-- 로그인 화면 (정식 로그인 · Firebase 인증) -->
<div class="lockscreen" id="lockScreen" style="display:none;">
  <div class="lockbox">
    <div class="lock-logo"><svg viewBox="0 0 24 24"><path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z" fill="#14210a"/></svg></div>
    <h2 id="lockTitle">퍼스널 트레이닝 랩</h2>
    <p>코치 전용 화면이에요. 로그인해 주세요.</p>
    <input type="email" id="loginEmail" placeholder="이메일" autocomplete="username" />
    <input type="password" id="loginPw" placeholder="비밀번호" autocomplete="current-password" />
    <button class="btn btn-primary" onclick="tryLogin()">로그인</button>
    <div id="lockErr"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   황서린 코치 AI 트레이닝 스튜디오 — v1.0
   단일 파일 / 브라우저(localStorage) 저장 / 오프라인 동작
   ========================================================= */

const STORE_KEY = "hsr_studio_v1";
const COACH = "황서린";                 // 코치 이름 (앱 곳곳에 반영)
const BRAND_NAME = "퍼스널 트레이닝 랩";  // 헤더 브랜드명 — 여기만 바꾸면 전체 반영

/* ---------- Firebase (선택) ----------
   아래 값을 본인 Firebase 프로젝트 설정으로 채우면 '고객 포털' 공유가 켜집니다.
   비워두면 이 브라우저(localStorage)로만 동작해요. 설정법: Firebase-설정-가이드.html */
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || { apiKey:"" };
let cloud=null, cloudOn=false, auth=null, currentUser=null;
function initCloud(){
  try{
    if(FIREBASE_CONFIG.apiKey && window.firebase){
      firebase.initializeApp(FIREBASE_CONFIG);
      cloud=firebase.firestore(); cloudOn=true;
      if(firebase.auth) auth=firebase.auth();
    }
  }catch(e){ console.warn("Firebase init 실패:", e); cloudOn=false; }
}
function cloudPublish(clientId){
  if(!cloudOn||!clientId) return;
  const c=DB.clients.find(x=>x.id===clientId); if(!c) return;
  const payload={ coach:COACH, brand:BRAND_NAME, profile:c,
    program:DB.programs[clientId]||null, records:(DB.records&&DB.records[clientId])||[], updated:Date.now() };
  try{ cloud.collection("clients").doc(clientId).set(payload,{merge:true}).catch(e=>console.warn("cloud set",e)); }catch(e){ console.warn(e); }
}
function cloudDelete(clientId){
  if(!cloudOn||!clientId) return;
  try{ cloud.collection("clients").doc(clientId).delete().catch(()=>{}); }catch(e){}
  try{ cloud.collection("completions").doc(clientId).delete().catch(()=>{}); }catch(e){}
}
function portalLink(id){ let b=location.href.split("#")[0].split("?")[0]; b=b.replace(/[^/]*$/,""); return b+"portal.html?id="+id; }
function copyPortalLink(id){
  if(!cloudOn) toast("먼저 Firebase 설정이 필요해요 (가이드 참고)");
  copyText(portalLink(id), cloudOn?"고객 포털 링크":"링크(설정 후 작동)");
}

/* ---------- 정식 로그인 (Firebase 인증) + 클라우드 목록 ---------- */
function tryLogin(){
  const email=document.getElementById("loginEmail").value.trim();
  const pw=document.getElementById("loginPw").value;
  const errEl=document.getElementById("lockErr");
  if(!auth){ errEl.textContent="로그인 준비가 안 됐어요. 잠시 후 다시 시도하세요."; return; }
  if(!email||!pw){ errEl.textContent="이메일과 비밀번호를 입력하세요."; return; }
  errEl.textContent="로그인 중…";
  auth.signInWithEmailAndPassword(email,pw)
    .then(()=>{ errEl.textContent=""; })
    .catch(e=>{
      const m=e.code||"";
      errEl.textContent = /wrong-password|user-not-found|invalid-credential|invalid-email/.test(m)
        ? "이메일 또는 비밀번호가 맞지 않아요." : "로그인 실패: "+(e.message||m);
    });
}
function logout(){ if(auth) auth.signOut(); }
async function loadFromCloud(){
  if(!cloudOn) return;
  try{
    const qs=await cloud.collection("clients").get();
    const cClients=[],cPrograms={},cRecords={},ids=new Set();
    qs.forEach(s=>{ const d=s.data(); ids.add(s.id); if(d.profile)cClients.push(d.profile); if(d.program)cPrograms[s.id]=d.program; if(d.records)cRecords[s.id]=d.records; });
    // 이 브라우저에만 있던 고객은 클라우드로 올리고 목록에 유지 (데이터 유실 방지)
    DB.clients.forEach(c=>{ if(!ids.has(c.id)){ cClients.push(c); if(DB.programs[c.id])cPrograms[c.id]=DB.programs[c.id]; if(DB.records&&DB.records[c.id])cRecords[c.id]=DB.records[c.id]; cloudPublish(c.id); } });
    DB.clients=cClients; DB.programs=cPrograms; DB.records=cRecords; saveDB();
  }catch(e){ console.warn("cloud load",e); }
}
async function reloadClients(){
  if(!cloudOn){ toast("클라우드가 꺼져 있어요"); return; }
  toast("목록 불러오는 중…"); await loadFromCloud(); render(); toast("목록 새로고침 ✓");
}
async function bootData(){
  if(cloudOn) await loadFromCloud();
  renderNav(); render();
}

/* ---------- 저장소 ---------- */
function loadDB(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {clients:[], programs:{}, contents:[], records:{}}; }
  catch(e){ return {clients:[], programs:{}, contents:[], records:{}}; }
}
function saveDB(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
let DB = loadDB();
DB.records = DB.records || {};
let currentClientId = null;   // 탭 간 공유되는 선택 고객
let activeTab = "clients";

/* ---------- 유틸 ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function initial(name){ return (name||"?").trim().charAt(0); }
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800);
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function copyText(txt,label){
  navigator.clipboard.writeText(txt).then(()=>toast((label||"복사")+" 완료 ✓"))
  .catch(()=>{ const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast((label||"복사")+" 완료 ✓"); });
}

/* ---------- 탭 정의 ---------- */
const TABS = [
  {id:"clients",  name:"고객 관리",     ic:"👥"},
  {id:"program",  name:"운동 프로그램",  ic:"🏋️"},
  {id:"feedback", name:"피드백·식단",   ic:"📝"},
  {id:"content",  name:"인스타 콘텐츠", ic:"📱"},
  {id:"checkin",  name:"주간 체크인",   ic:"💬"},
  {id:"calendar", name:"콘텐츠 캘린더", ic:"📅"},
  {id:"faq",      name:"FAQ 챗봇",      ic:"🤖"},
];

function renderNav(){
  const d=document.getElementById("navDesktop"); d.innerHTML="";
  TABS.forEach(t=>{
    const cnt = t.id==="clients" ? `<span class="cnt">${DB.clients.length}</span>` : "";
    const b=document.createElement("button");
    b.className="nav-btn"+(activeTab===t.id?" active":"");
    b.title=t.name;
    b.innerHTML=`<span class="ic">${t.ic}</span><span class="label">${t.name}</span>${cnt}`;
    b.onclick=()=>go(t.id); d.appendChild(b);
  });
}

function go(tab){ activeTab=tab; renderNav(); render(); window.scrollTo(0,0); }

/* ---------- 공유 고객 선택 바 ---------- */
function clientBarHTML(){
  if(DB.clients.length===0) return "";
  const opts = DB.clients.map(c=>`<option value="${c.id}" ${c.id===currentClientId?"selected":""}>${esc(c.name)} · ${esc(c.goal)}</option>`).join("");
  const cur = DB.clients.find(c=>c.id===currentClientId);
  return `<div class="clientbar no-print">
    <div class="avatar">${esc(initial(cur?cur.name:"?"))}</div>
    <div style="font-size:12.5px;color:var(--text-dim)">작업 대상 고객</div>
    <select onchange="currentClientId=this.value; render();">${opts}</select>
  </div>`;
}

/* =========================================================
   1) 고객 관리
   ========================================================= */
function viewClients(){
  const list = DB.clients.length===0
    ? `<div class="empty"><div class="big">👥</div>아직 등록된 고객이 없어요.<br/>첫 고객을 등록하면 모든 탭에서 불러 쓸 수 있어요.</div>`
    : `<div class="client-list">`+DB.clients.map(c=>`
        <div class="client-item">
          <div class="client-meta">
            <b>${esc(c.name)}</b>
            <small>${c.age?esc(c.age)+"세 · ":""}${esc(c.sex||"")} · ${esc(c.level)}</small>
          </div>
          <div class="sp">
            <span class="pill">${esc(c.goal)}</span>
            <button class="btn btn-ghost btn-sm" onclick="openRecords('${c.id}')">📋 기록</button>
            <button class="btn btn-ghost btn-sm" onclick="copyPortalLink('${c.id}')">🔗 포털 링크</button>
            <button class="btn btn-ghost btn-sm" onclick="openClient('${c.id}')">수정</button>
            <button class="btn btn-danger btn-sm" onclick="delClient('${c.id}')">삭제</button>
          </div>
        </div>`).join("")+`</div>`;

  const cloudStatus = cloudOn
    ? `<span class="pill" style="color:var(--ok);border-color:rgba(55,214,122,.4);">🟢 공유·포털 켜짐</span>`
    : `<span class="pill">⚪ 클라우드 설정 필요 — 가이드 참고</span>`;

  return `
    <h1 class="page-title">고객 관리</h1>
    <p class="page-sub">${cloudOn?"이 목록은 클라우드에 저장돼 코치·관리자가 같은 화면을 봐요.":"여기서 등록한 고객을 모든 탭에서 공유해서 써요."} '기록'으로 진행 메모를, '포털 링크'로 고객이 직접 볼 수 있는 링크를 만들어요.</p>
    <div class="card">
      <h3>👥 내 고객 (${DB.clients.length}) &nbsp; ${cloudStatus}</h3>
      ${list}
      <div class="row-actions">
        <button class="btn btn-primary" onclick="openClient()">+ 새 고객 등록</button>
        ${cloudOn?`<button class="btn btn-ghost" onclick="reloadClients()">🔄 목록 새로고침</button>`:""}
      </div>
    </div>`;
}

function openClient(id){
  const c = id ? DB.clients.find(x=>x.id===id) : null;
  document.getElementById("cmTitle").textContent = c?"고객 정보 수정":"고객 등록";
  document.getElementById("cmId").value = c?c.id:"";
  document.getElementById("cmName").value = c?c.name:"";
  document.getElementById("cmAge").value = c?(c.age||""):"";
  document.getElementById("cmSex").value = c?(c.sex||"여성"):"여성";
  document.getElementById("cmGoal").value = c?c.goal:"근성장";
  document.getElementById("cmLevel").value = c?c.level:"초급";
  document.getElementById("cmNote").value = c?(c.note||""):"";
  document.getElementById("clientModal").classList.add("show");
}
function closeModal(){ document.getElementById("clientModal").classList.remove("show"); }
function saveClient(){
  const name=document.getElementById("cmName").value.trim();
  if(!name){ toast("이름을 입력해 주세요"); return; }
  const id=document.getElementById("cmId").value;
  const data={
    name, age:document.getElementById("cmAge").value.trim(),
    sex:document.getElementById("cmSex").value, goal:document.getElementById("cmGoal").value,
    level:document.getElementById("cmLevel").value, note:document.getElementById("cmNote").value.trim()
  };
  let savedId=id;
  if(id){ const c=DB.clients.find(x=>x.id===id); Object.assign(c,data); }
  else { const nid=uid(); DB.clients.push({id:nid,...data,created:Date.now()}); currentClientId=nid; savedId=nid; }
  saveDB(); cloudPublish(savedId); closeModal(); render(); toast("저장되었습니다 ✓");
}
function delClient(id){
  if(!confirm("이 고객을 삭제할까요? 저장된 프로그램·기록도 함께 삭제됩니다.")) return;
  DB.clients=DB.clients.filter(c=>c.id!==id); delete DB.programs[id]; if(DB.records) delete DB.records[id];
  if(currentClientId===id) currentClientId=null;
  saveDB(); cloudDelete(id); render(); toast("삭제되었습니다");
}

/* ---------- 고객 진행 기록 ---------- */
function openRecords(id){
  const c=DB.clients.find(x=>x.id===id); if(!c) return;
  document.getElementById("rcTitle").textContent=c.name+"님 진행 기록";
  document.getElementById("rcClientId").value=id;
  document.getElementById("rcDate").value=""; document.getElementById("rcTag").value=""; document.getElementById("rcText").value="";
  renderRecordList(id);
  document.getElementById("recModal").classList.add("show");
}
function renderRecordList(id){
  const recs=(DB.records&&DB.records[id])||[];
  document.getElementById("rcList").innerHTML = recs.length ? recs.map((r,i)=>`
    <div style="background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;">
        <b style="font-size:13px;color:var(--brand-accent);">${esc(r.date||"기록")}</b>
        ${r.tag?`<span class="pill">${esc(r.tag)}</span>`:""}
        <button class="btn btn-danger btn-sm" style="margin-left:auto;" onclick="delRecord('${id}',${i})">삭제</button>
      </div>
      <div style="font-size:13.5px;white-space:pre-wrap;">${esc(r.text)}</div>
    </div>`).join("") : `<p style="color:var(--text-mute);font-size:13px;margin-top:10px;">아직 기록이 없어요. 첫 기록을 추가해 보세요.</p>`;
}
function addRecord(){
  const id=document.getElementById("rcClientId").value;
  const text=document.getElementById("rcText").value.trim();
  if(!text){ toast("내용을 입력하세요"); return; }
  DB.records=DB.records||{}; DB.records[id]=DB.records[id]||[];
  DB.records[id].unshift({date:document.getElementById("rcDate").value.trim(), tag:document.getElementById("rcTag").value.trim(), text, ts:Date.now()});
  saveDB(); cloudPublish(id); renderRecordList(id);
  document.getElementById("rcDate").value=""; document.getElementById("rcTag").value=""; document.getElementById("rcText").value="";
  toast("기록 추가 ✓");
}
function delRecord(id,i){
  if(!DB.records||!DB.records[id]) return;
  DB.records[id].splice(i,1); saveDB(); cloudPublish(id); renderRecordList(id);
}

};
const CARDIO = ["빠르게 걷기(경사)","실내 자전거","로잉머신","줄넘기","계단 오르기","버피","점핑잭"];

// 분할 설계: 주 횟수별 요일 구성
function splitPlan(freq, goal){
  if(freq<=2) return [["가슴","등","하체","코어"],["어깨","팔","하체","코어"]];
  if(freq===3){
    if(goal==="다이어트"||goal==="기초체력") return [["하체","코어","가슴"],["등","어깨","코어"],["하체","팔","코어"]];
    return [["가슴","어깨","팔"],["등","팔","코어"],["하체","코어"]]; // 밀기/당기기/하체
  }
  if(freq===4) return [["가슴","어깨","팔"],["등","팔","코어"],["하체","코어"],["어깨","등","코어"]];
  // 5회
  return [["가슴","팔"],["등","코어"],["하체"],["어깨","팔"],["하체","코어"]];
}

// 목표별 세트/반복/휴식/점진 스킴
function scheme(goal, level, week, totalWeeks){
  let base;
  if(goal==="근력") base={sets:5,rep:"3~5회",rest:"2~3분",cardio:0};
  else if(goal==="근성장") base={sets:4,rep:"8~12회",rest:"60~90초",cardio:0};
  else if(goal==="다이어트") base={sets:3,rep:"12~15회",rest:"30~45초",cardio:2};
  else if(goal==="체형교정") base={sets:3,rep:"12~15회(천천히)",rest:"45~60초",cardio:0};
  else base={sets:2,rep:"10~12회",rest:"60초",cardio:0}; // 기초체력
  if(level==="초급" && base.sets>3) base.sets=3;
  if(level==="고급" && goal==="근성장") base.sets=4;
  // 점진적 부하: 주차 진행에 따른 코칭 큐
  const prog = progressionCue(goal, level, week, totalWeeks);
  return {...base, prog};
}
function progressionCue(goal, level, week, totalWeeks){
  const isDeload = totalWeeks>=8 && week%4===0; // 4주마다 디로드
  if(isDeload) return {tag:"디로드", note:"강도 40~50%로 낮추고 폼·회복에 집중 (부하 내리기)"};
  const step = week; // 1주차부터 누적
  if(goal==="근력"||goal==="근성장"){
    const pct = Math.min(2.5*(step-1),12.5);
    return {tag:`${week}주차`, note: step===1?"기준 무게 설정(마지막 2회가 힘든 무게)":`지난주 대비 무게 약 ${pct}%↑ 또는 반복 +1~2회`};
  }
  if(goal==="다이어트"){
    return {tag:`${week}주차`, note: step===1?"자세 익히기 + 휴식 정확히 지키기":`세트 간 휴식 ${Math.max(30,45-5*(step-1))}초로 단축, 반복 유지`};
  }
  return {tag:`${week}주차`, note: step===1?"가동범위·정렬 우선, 통증 없는 범위":"움직임이 편해지면 반복/세트 점진 증가"};
}

function buildExerciseList(parts, equips, goal, level){
  const out=[];
  const perPart = parts.length<=2 ? 3 : (parts.length===3?2:2);
  parts.forEach(part=>{
    let pool=[];
    equips.forEach(eq=>{ if(EX[part]&&EX[part][eq]) pool=pool.concat(EX[part][eq]); });
    if(pool.length===0 && EX[part]) pool=EX[part]["맨몸"]||[];
    pool=shuffle([...new Set(pool)]);
    let n = perPart; if(part==="코어") n=Math.min(2,pool.length);
    pool.slice(0,Math.max(1,n)).forEach(name=>out.push({part,name}));
  });
  return out;
}

function generateProgram(){
  const c = DB.clients.find(x=>x.id===currentClientId);
  if(!c){ toast("먼저 고객을 선택/등록하세요"); return; }
  const equips = window._equips && window._equips.length ? window._equips : ["맨몸"];
  const freq = parseInt(document.getElementById("pgFreq").value);
  const weeks = parseInt(document.getElementById("pgWeeks").value);
  const goal = document.getElementById("pgGoal").value;
  const level = document.getElementById("pgLevel").value;
  const focus = document.getElementById("pgFocus").value.trim();

  const split = splitPlan(freq, goal).slice(0,freq);
  const weeksArr=[];
  for(let w=1; w<=weeks; w++){
    const sc = scheme(goal, level, w, weeks);
    const days = split.map((parts,di)=>{
      const exs = buildExerciseList(parts, equips, goal, level);
      return {day:di+1, parts, exercises:exs, sets:sc.sets, rep:sc.rep, rest:sc.rest,
              cardio: sc.cardio>0 ? {rounds:sc.cardio, moves:shuffle(CARDIO).slice(0,2)} : null };
    });
    weeksArr.push({week:w, prog:sc.prog, days});
  }
  const program={id:uid(), clientId:c.id, goal, level, freq, weeks, focus, equips, created:Date.now(), weeksArr};
  DB.programs[c.id]=program; saveDB(); cloudPublish(c.id);
  clearDayEdit();
  render();
  setTimeout(()=>{const el=document.getElementById("progResult"); if(el) el.scrollIntoView({behavior:"smooth"});},60);
  toast("프로그램이 생성되었습니다 ✓");
}

/* 고객 완료 현황 (고객 포털에서 체크한 내용을 클라우드에서 읽어와 표시) */
function doneStatusHTML(p,comp){
  let totalDays=0,doneDays=0,partDays=0,totalEx=0,doneEx=0; const badges=[];
  p.weeksArr.forEach(w=>w.days.forEach(d=>{
    totalDays++;
    const n=d.exercises.length+(d.cardio?1:0); const dayKey="w"+w.week+"d"+d.day;
    let dn=0; for(let i=0;i<n;i++) if(comp[dayKey+"i"+i]) dn++;
    totalEx+=n; doneEx+=dn;
    let cls='', mark='⚪';
    if(n>0&&dn===n){ doneDays++; cls='color:var(--ok);border-color:rgba(55,214,122,.45);'; mark='✅'; }
    else if(dn>0){ partDays++; cls='color:#ffcf3f;border-color:rgba(255,207,63,.45);'; mark='🟡'; }
    badges.push(`<span class="pill" style="${cls}">${mark} ${w.week}주 D${d.day} <b>${dn}/${n}</b></span>`);
  }));
  return `<div class="card"><h3>📊 고객 완료 현황</h3>
    <p style="font-size:14.5px;margin:0 0 5px;">완료 <b style="color:var(--ok)">${doneDays}일</b> · 진행 중 <b style="color:#ffcf3f">${partDays}일</b> · 미시작 ${totalDays-doneDays-partDays}일</p>
    <p style="font-size:12.5px;color:var(--text-dim);margin:0 0 12px;">전체 운동 ${totalEx}개 중 <b>${doneEx}개</b> 완료 ${doneEx>0?'🔥':''} &nbsp;·&nbsp; 고객이 포털에서 체크하면 <b style="color:var(--ok)">실시간으로 자동 반영</b>돼요 ⚡</p>
    <div class="chips">${badges.join("")}</div></div>`;
}
/* 실시간 감시: 고객이 포털에서 체크하는 즉시 자동 갱신 (onSnapshot) */
let doneUnsub=null;
function stopDoneWatch(){ if(doneUnsub){ try{doneUnsub();}catch(e){} doneUnsub=null; } }
function watchDoneStatus(){
  stopDoneWatch();
  const el=document.getElementById("doneStatus"); if(!el) return;
  const c=DB.clients.find(x=>x.id===currentClientId); const p=c&&DB.programs[c.id]; if(!p) return;
  if(!cloudOn){ el.innerHTML=`<div class="disclaimer">고객 포털(Firebase)이 켜지면 여기서 고객의 완료 체크 현황을 볼 수 있어요.</div>`; return; }
  el.innerHTML=`<p style="color:var(--text-dim);font-size:13px;margin-top:14px;">완료 현황 불러오는 중…</p>`;
  const cid=c.id;
  doneUnsub = cloud.collection("completions").doc(cid).onSnapshot(
    snap=>{
      if(currentClientId!==cid) return;
      const comp=(snap.exists&&snap.data())||{};
      const cur=DB.clients.find(x=>x.id===cid), pp=cur&&DB.programs[cid], box=document.getElementById("doneStatus");
      if(pp&&box) box.innerHTML=doneStatusHTML(pp,comp);
    },
    err=>{ console.warn("done watch",err); const e2=document.getElementById("doneStatus"); if(e2) e2.innerHTML=`<p style="color:var(--text-mute);font-size:12px;margin-top:14px;">완료 현황을 불러오지 못했어요.</p>`; }
  );
}

  const c=DB.clients.find(x=>x.id===currentClientId); const p=c&&DB.programs[c.id]; if(!p) return;

function toggleEquip(e){
  window._equips = window._equips||[];
  if(window._equips.includes(e)) window._equips=window._equips.filter(x=>x!==e);
  else window._equips.push(e);
  if(window._equips.length===0) window._equips=["맨몸"];
  render();
}

const HOOKS = [
  t=>`${t}, 아직도 이렇게 하고 계세요? 🙅‍♀️`,
  t=>`${t} 할 때 90%가 놓치는 것 딱 하나.`,
  t=>`PT 10년차가 알려주는 ${t}의 진실.`,
  t=>`${t}, 이거 모르면 시간 낭비예요.`,
  t=>`살면서 한 번은 꼭 봐야 할 ${t} 꿀팁.`,
  t=>`${t} 3일만 이렇게 해보세요. 몸이 바뀝니다.`,
  t=>`운동 초보일수록 ${t} 이렇게 하세요.`,
  t=>`${t}, 헬스장에서 아무도 안 알려주는 것.`
];
const CTA = [
  "저장하고 다음 운동 때 꼭 따라 해보세요 💪",
  "궁금한 건 댓글로! 서린쌤이 직접 답해드려요 🙌",
  "주변에 운동 고민하는 친구 있으면 공유해 주세요 🔁",
  "더 자세한 코칭이 필요하면 프로필 링크 확인 👀",
  "오늘도 한 세트만 더! 저장 필수 ⭐"
];
const HASH_BASE = ["#황서린코치","#헬스","#운동","#홈트","#다이어트","#근력운동","#헬스타그램","#운동스타그램","#PT","#바디프로필","#헬린이","#오운완"];

function seorinScript(topic){
  const t=topic.trim();
  const hook = pick(HOOKS)(t);
  const bodyTemplates=[
    [`먼저, 왜 ${t}가 중요한지부터 짚고 갈게요.`,
     `대부분 여기서 실수해요 — 무게보다 '자세'가 먼저예요.`,
     `핵심 포인트 3가지만 기억하세요.\n1) 호흡: 힘 줄 때 내쉬기\n2) 가동범위: 끝까지, 반동 없이\n3) 속도: 내릴 때 2초, 천천히`,
     `이 세 가지만 지켜도 효과가 확 달라져요.`],
    [`${t}, 저도 처음엔 진짜 많이 헤맸어요.`,
     `그런데 이 방법 하나 바꾸고 나서 회원분들 결과가 달라졌어요.`,
     `오늘 딱 알려드릴 건 '천천히, 정확하게'예요.\n반복 수보다 한 번의 정확한 동작이 훨씬 중요해요.`,
     `무리하지 말고, 내 몸 상태에 맞춰서 가는 게 제일 빨라요.`],
    [`${t} 할 때 이 부위에 자극이 안 온다면 자세를 점검하세요.`,
     `체크리스트 갈게요 ✅\n· 발 위치는 어깨너비인가?\n· 코어에 힘이 들어가 있나?\n· 목·허리는 중립인가?`,
     `하나라도 놓치면 엉뚱한 데 힘이 들어가요.`,
     `거울 보면서 한 세트만 천천히 해보면 바로 느껴질 거예요.`]
  ];
  const body = pick(bodyTemplates);
  const cta = pick(CTA);
  return {hook, body, cta};
}

function generateContent(){
  const topic=document.getElementById("ctTopic").value.trim();
  if(!topic){ toast("주제를 입력해 주세요"); return; }
  const tone=document.getElementById("ctTone").value;
  const s=seorinScript(topic);

  // 톤 보정
  let opener = s.hook;
  if(tone==="전문적") opener = `${topic}에 대해 정확히 알려드릴게요.`;
  if(tone==="유쾌") opener = s.hook+" 😆";

  const scriptFull = `🎬 [0~2초 · 훅]\n${opener}\n\n🎬 [3~10초 · 전개]\n${s.body[0]}\n${s.body[1]}\n\n🎬 [11~25초 · 핵심]\n${s.body[2]}\n\n🎬 [26~30초 · 마무리 & CTA]\n${s.body[3]}\n${s.cta}`;

  const caption = `${opener}\n\n${topic}, 어렵게 생각하지 마세요. 오늘 알려드린 포인트만 기억하면 돼요 💪\n\n${s.body[3]}\n\n${s.cta}\n\n— ${COACH} 코치\n\n※ 통증이나 질환이 있다면 무리하지 말고 전문가와 상담하세요.`;

  // 해시태그: 주제 키워드 반영
  const topicTag = "#"+topic.replace(/\s+/g,"");
  const tags = shuffle(HASH_BASE).slice(0,9);
  const hashline = [topicTag, ...tags].filter((v,i,a)=>a.indexOf(v)===i).slice(0,12).join(" ");

  const hookVariants = shuffle(HOOKS).slice(0,3).map(f=>f(topic));

  DB.contents.unshift({id:uid(),topic,created:Date.now()});
  if(DB.contents.length>30) DB.contents.pop();
  saveDB();

  const html = `<div class="result" id="ctResult">
    <div class="out-block">
      <div class="lab">🎣 훅 후보 (3개 중 골라 쓰기)</div>
      <div class="out-body">${hookVariants.map((h,i)=>`${i+1}. ${esc(h)}`).join("\n")}<button class="btn btn-lime btn-sm copybtn" onclick='copyText(${JSON.stringify(hookVariants.join("\n"))},"훅")'>복사</button></div>
    </div>
    <div class="out-block">
      <div class="lab">🎬 릴스 대본 (약 30초)</div>
      <div class="out-body">${esc(scriptFull)}<button class="btn btn-lime btn-sm copybtn" onclick='copyText(${JSON.stringify(scriptFull)},"대본")'>복사</button></div>
    </div>
    <div class="out-block">
      <div class="lab">✍️ 캡션</div>
      <div class="out-body">${esc(caption)}<button class="btn btn-lime btn-sm copybtn" onclick='copyText(${JSON.stringify(caption)},"캡션")'>복사</button></div>
    </div>
    <div class="out-block">
      <div class="lab"># 해시태그</div>
      <div class="out-body hashline">${esc(hashline)}<button class="btn btn-lime btn-sm copybtn" onclick='copyText(${JSON.stringify(hashline)},"해시태그")'>복사</button></div>
    </div>
    <div class="row-actions">
      <button class="btn btn-primary" onclick="generateContent()">↻ 다른 버전 생성</button>
      <button class="btn btn-ghost" onclick='copyText(${JSON.stringify(scriptFull+"\n\n"+caption+"\n\n"+hashline)},"전체")'>📋 전체 복사</button>
    </div>
    <div class="disclaimer">⚠️ 운동·건강 정보는 일반적인 참고용이며 의료적 조언이 아닙니다. 팔로워에게 통증·질환 시 전문가 상담을 권하는 문구를 함께 넣는 것을 권장합니다.</div>
  </div>`;
  document.getElementById("ctOut").innerHTML = html;
  setTimeout(()=>document.getElementById("ctResult").scrollIntoView({behavior:"smooth"}),60);
  toast("콘텐츠가 생성되었습니다 ✓");
}

function generateCalendar(){
  const days=[]; const shuffled={};
  for(let i=0;i<30;i++){
    const p=PILLARS[i%PILLARS.length];
    shuffled[p.tag]=shuffled[p.tag]||shuffle(p.pool);
    const idea=shuffled[p.tag][Math.floor(i/PILLARS.length)%p.pool.length];
    days.push({day:i+1,tag:p.tag,fmt:p.fmt,idea});
  }
  DB._calendar=days; saveDB(); render();
  setTimeout(()=>{const e=document.getElementById("calResult");if(e)e.scrollIntoView({behavior:"smooth"});},60);
  toast("30일 캘린더 생성 ✓");
}

  return `<div class="result" id="calResult">

function faqAnswer(q){
  const text=q.toLowerCase(); let best=null,score=0;
  FAQ_KB.forEach(it=>{ let s=0; it.k.forEach(kw=>{ if(text.includes(kw.toLowerCase())) s++; }); if(s>score){score=s;best=it;} });

}

function compressImage(file, maxW, cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cb(cv.toDataURL("image/jpeg",0.7));
    };
    img.onerror=()=>cb(null);
    img.src=e.target.result;
  };
  reader.onerror=()=>cb(null);
  reader.readAsDataURL(file);
}

        </div>`; }).join("");
  }catch(e){ console.warn(e); }
}
function sendFeedback(){
  const c=DB.clients.find(x=>x.id===currentClientId); if(!c) return;
  if(!cloudOn){ toast("로그인(클라우드)이 필요해요"); return; }
  const text=document.getElementById("fbText").value.trim();
  const file=document.getElementById("fbPhoto").files[0];
  if(!text && !file){ toast("내용이나 사진을 넣어주세요"); return; }
  const doSave=(img)=>{
    cloud.collection("feedback").doc(c.id).collection("items").add({ts:Date.now(), text, img:img||null})
      .then(()=>{ document.getElementById("fbText").value=""; const fp=document.getElementById("fbPhoto"); if(fp) fp.value=""; loadFeedback(); toast("피드백 전송 ✓"); })
      .catch(e=>{ console.warn(e); toast("전송 실패"); });
  };
  toast("보내는 중…");
  if(file) compressImage(file,1000,doSave); else doSave(null);
}
function delFeedback(cid, id){
  if(!confirm("이 피드백을 삭제할까요?")) return;
  cloud.collection("feedback").doc(cid).collection("items").doc(id).delete().then(()=>loadFeedback()).catch(()=>{});
}

/* ---------- 라우터 ---------- */
function render(){
  const el=document.getElementById("content");
  if(activeTab==="clients") el.innerHTML=viewClients();
  else if(activeTab==="program") el.innerHTML=viewProgram();
  else if(activeTab==="content") el.innerHTML=viewContent();
  else if(activeTab==="checkin") el.innerHTML=viewCheckin();
  else if(activeTab==="calendar") el.innerHTML=viewCalendar();
  else if(activeTab==="faq") el.innerHTML=viewFaq();
  else if(activeTab==="feedback") el.innerHTML=viewFeedback();
  renderNav();
  if(activeTab==="faq") renderFaqLog();
  if(activeTab==="feedback"){ setTimeout(()=>{ loadDiet(); loadFeedback(); },50); }
  stopDoneWatch();
  if(activeTab==="program") setTimeout(watchDoneStatus,50);
}

document.getElementById("brandPre").textContent = COACH+" 코치의";

document.getElementById("loginPw").addEventListener("keydown",e=>{ if(e.key==="Enter") tryLogin(); });

if(cloudOn && auth){
  // 정식 로그인 필요 (이메일/비밀번호)
  auth.onAuthStateChanged(user=>{
    currentUser=user;
    const fl=document.getElementById("logoutLink"), fu=document.getElementById("footUser");
    if(user){
      document.getElementById("lockScreen").style.display="none";
      if(fl) fl.style.display="inline"; if(fu) fu.textContent=(user.email||"")+" · ";
      bootData();
    }else{
      if(fl) fl.style.display="none"; if(fu) fu.textContent="";
      document.getElementById("lockScreen").style.display="flex";
      setTimeout(()=>{const el=document.getElementById("loginEmail"); if(el) el.focus();},100);
    }
  });
}else{
  // Firebase 미설정: 로컬 전용 (로그인 없이 동작)
  document.getElementById("lockScreen").style.display="none";
  bootData();
}
