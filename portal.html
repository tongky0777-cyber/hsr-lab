<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>나의 트레이닝 기록</title>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --brand-primary:#FF6A1A;--brand-accent:#B7E400;--ok:#37d67a;
    --bg:#0f1115;--bg-soft:#171a21;--card:#1d212b;--card-2:#232836;--line:#2c3240;
    --text:#f2f4f8;--dim:#9aa4b5;--mute:#6b7484;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);min-height:100vh;}
  .wrap{max-width:620px;margin:0 auto;padding:0 16px 60px;}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:14px 16px;margin:0 -16px 22px;}
  .logo{width:40px;height:40px;border-radius:12px;flex:0 0 40px;background:linear-gradient(135deg,var(--brand-primary),var(--brand-accent));display:flex;align-items:center;justify-content:center;box-shadow:0 5px 16px rgba(255,106,26,.4);}
  .logo svg{width:23px;height:23px;}
  .tb .pre{font-size:11px;color:var(--dim);font-weight:600;}
  .tb .nm{font-size:15px;font-weight:900;letter-spacing:-.4px;background:linear-gradient(92deg,var(--brand-primary),var(--brand-accent));-webkit-background-clip:text;background-clip:text;color:transparent;}

  .hero{margin-bottom:18px;}
  .hero h1{font-size:24px;letter-spacing:-.6px;margin-bottom:8px;}
  .hero .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .pill{font-size:12px;padding:4px 11px;border-radius:20px;background:var(--card-2);color:var(--dim);border:1px solid var(--line);}
  .pill.p{background:rgba(255,106,26,.16);color:var(--brand-primary);border-color:transparent;font-weight:700;}

  .sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:16px;}
  .sec h2{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .prog-sum{font-size:14px;color:var(--dim);margin-bottom:14px;padding:10px 13px;background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;}
  .prog-sum b{color:var(--brand-accent);}

  .week{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px;}
  .week-h{background:var(--card-2);padding:10px 13px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:9px;}
  .tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:rgba(183,228,0,.18);color:var(--brand-accent);}
  .day{padding:10px 13px 13px;}
  .day-t{display:flex;align-items:center;gap:8px;margin:6px 0 9px;font-weight:800;font-size:13px;}
  .daychip{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--brand-primary);color:#fff;font-weight:700;}
  .day-badge{margin-left:auto;font-size:11px;padding:3px 10px;border-radius:20px;background:var(--card-2);color:var(--dim);border:1px solid var(--line);}
  .day-badge.done{background:rgba(55,214,122,.16);color:var(--ok);border-color:rgba(55,214,122,.45);}

  .ex-list{display:flex;flex-direction:column;gap:7px;}
  .ex{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg-soft);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--text);cursor:pointer;transition:.12s;}
  .ex:active{transform:scale(.99);}
  .ex.on{background:rgba(55,214,122,.09);border-color:rgba(55,214,122,.4);}
  .tick{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:2px solid var(--mute);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:transparent;transition:.12s;}
  .ex.on .tick{background:var(--ok);border-color:var(--ok);color:#08210f;}
  .exn{font-size:14px;flex:1;}
  .ex.on .exn{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(154,164,181,.5);}
  .exn em{color:var(--dim);font-style:normal;font-size:12px;display:block;margin-top:2px;text-decoration:none;}
  .day-done{display:none;margin-top:9px;font-size:13.5px;font-weight:800;color:var(--ok);padding:9px 12px;background:rgba(55,214,122,.1);border:1px solid rgba(55,214,122,.3);border-radius:10px;text-align:center;}
  .day-done.show{display:block;animation:pop .3s ease;}
  @keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}

  .rec{border-left:3px solid var(--brand-accent);background:var(--bg-soft);border-radius:0 10px 10px 0;padding:11px 14px;margin-bottom:10px;}
  .rec .h{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .rec .h b{font-size:13px;color:var(--brand-accent);}
  .rec .t{font-size:13.5px;line-height:1.6;white-space:pre-wrap;}

  .disc{font-size:11.5px;color:var(--mute);background:rgba(255,84,112,.07);border:1px solid rgba(255,84,112,.22);border-radius:10px;padding:11px 13px;line-height:1.55;margin-top:6px;}
  .state{text-align:center;padding:60px 20px;color:var(--dim);}
  .state .big{font-size:40px;margin-bottom:14px;}
  .state h2{font-size:18px;margin-bottom:8px;color:var(--text);}
  .foot{text-align:center;color:var(--mute);font-size:11.5px;margin-top:20px;}
  .empty{color:var(--mute);font-size:13px;text-align:center;padding:16px;}
</style></head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z" fill="#14210a"/></svg></div>
    <div class="tb"><div class="pre" id="tbPre">황서린 코치의</div><div class="nm" id="tbNm">퍼스널 트레이닝 랩</div></div>
  </div>
  <div id="app"><div class="state"><div class="big">⏳</div><h2>불러오는 중…</h2></div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const $=id=>document.getElementById(id);
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function qp(k){ return new URLSearchParams(location.search).get(k); }
let state={id:null, db:null, data:null, days:[]};

/* 데모 데이터 (렌더 확인용: portal.html?demo=1) */
const DEMO={ coach:"황서린", brand:"퍼스널 트레이닝 랩",
  profile:{name:"박서연",age:"29",sex:"여성",goal:"다이어트",level:"초급"},
  completions:{"w1d1i0":true,"w1d1i1":true},
  program:{goal:"다이어트",level:"초급",freq:3,weeks:4,equips:["맨몸","덤벨"],
    weeksArr:[
      {week:1,prog:{tag:"1주차",note:"자세 익히기 + 휴식 정확히 지키기"},days:[
        {day:1,parts:["하체","코어"],sets:3,rep:"12~15회",rest:"30~45초",
          exercises:[{part:"하체",name:"고블릿 스쿼트"},{part:"하체",name:"덤벨 런지"},{part:"코어",name:"플랭크"}],
          cardio:{rounds:2,moves:["점핑잭","빠르게 걷기(경사)"]}},
        {day:2,parts:["등","어깨"],sets:3,rep:"12~15회",rest:"30~45초",
          exercises:[{part:"등",name:"덤벨 로우"},{part:"어깨",name:"사이드 레터럴 레이즈"}],cardio:null}
      ]},
      {week:2,prog:{tag:"2주차",note:"세트 간 휴식 40초로 단축, 반복 유지"},days:[
        {day:1,parts:["하체","코어"],sets:3,rep:"12~15회",rest:"40초",
          exercises:[{part:"하체",name:"덤벨 루마니안 데드리프트"},{part:"코어",name:"데드버그"}],cardio:{rounds:2,moves:["버피","줄넘기"]}}
      ]}
    ]},
  records:[
    {date:"2주차",tag:"인바디",text:"체중 -1.2kg, 골격근량 +0.3kg! 아주 좋은 출발이에요 👏"},
    {date:"1주차",tag:"피드백",text:"스쿼트 자세 많이 좋아졌어요. 다음 주엔 무게 살짝 올려볼게요."}
  ], updated:Date.now() };

function programHTML(p){
  if(!p||!p.weeksArr) return `<div class="empty">아직 등록된 프로그램이 없어요. 곧 코치님이 올려줄 거예요 😊</div>`;
  const comp=state.data.completions||{}; state.days=[];
  const weeks=p.weeksArr.map(w=>{
    const days=w.days.map(d=>{
      const dayKey="w"+w.week+"d"+d.day;
      const items=[];
      d.exercises.forEach(e=>items.push({label:esc(e.name), sub:esc(e.part)+" · "+d.sets+"세트 · "+esc(d.rep)}));
      if(d.cardio) items.push({label:"유산소 · "+d.cardio.moves.map(esc).join(" / "), sub:d.cardio.rounds+"라운드"});
      const keys=items.map((_,i)=>dayKey+"i"+i);
      state.days.push({dayKey, keys});
      const dn=keys.filter(k=>comp[k]).length, allDone=dn===keys.length&&keys.length>0;
      const rows=items.map((it,i)=>{
        const k=dayKey+"i"+i, on=!!comp[k];
        return `<button class="ex ${on?'on':''}" onclick="toggleItem('${k}',this)">
          <span class="tick">✓</span><span class="exn">${it.label}<em>${it.sub}</em></span></button>`;
      }).join("");
      return `<div class="day">
        <div class="day-t"><span class="daychip">DAY ${d.day}</span> <span>${d.parts.map(esc).join(" · ")}</span>
          <span class="day-badge ${allDone?'done':''}" id="db_${dayKey}">${dn}/${keys.length}</span></div>
        <div class="ex-list">${rows}</div>
        <div class="day-done ${allDone?'show':''}" id="dd_${dayKey}">🎉 오늘 운동 끝! 정말 잘하셨어요</div>
      </div>`;
    }).join("");
    return `<div class="week"><div class="week-h"><span class="tag">${esc(w.prog.tag)}</span> ${esc(w.prog.note)}</div>${days}</div>`;
  }).join("");
  const meta=[p.goal,p.level,"주 "+p.freq+"회 · "+p.weeks+"주",(p.equips||[]).join(", ")].filter(Boolean);
  return `<div class="prog-sum" id="progSum"></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">${meta.map(m=>`<span class="pill">${esc(m)}</span>`).join("")}</div>${weeks}`;
}
function recordsHTML(recs){
  if(!recs||!recs.length) return `<div class="empty">아직 남긴 기록이 없어요. 곧 코치님이 업데이트할 거예요 😊</div>`;
  return recs.map(r=>`<div class="rec"><div class="h"><b>${esc(r.date||"기록")}</b>${r.tag?`<span class="pill">${esc(r.tag)}</span>`:""}</div><div class="t">${esc(r.text)}</div></div>`).join("");
}
function fmtDate(ts){ if(!ts) return ""; const d=new Date(ts); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; }

function dayKeyOf(itemKey){ return itemKey.slice(0, itemKey.lastIndexOf("i")); }
function updateDay(dayKey){
  const comp=state.data.completions||{};
  const d=state.days.find(x=>x.dayKey===dayKey); if(!d) return;
  const dn=d.keys.filter(k=>comp[k]).length, total=d.keys.length, all=dn===total&&total>0;
  const badge=$("db_"+dayKey); if(badge){ badge.textContent=dn+"/"+total; badge.className="day-badge"+(all?" done":""); }
  const dd=$("dd_"+dayKey); if(dd) dd.className="day-done"+(all?" show":"");
}
function updateProgress(){
  const el=$("progSum"); if(!el) return;
  let done=0; state.days.forEach(d=>{ const comp=state.data.completions||{}; if(d.keys.length>0&&d.keys.every(k=>comp[k]))done++; });
  el.innerHTML=`이번 프로그램 <b>${done} / ${state.days.length}일</b> 완료 ${done>0?'🔥':''}`;
}
function toggleItem(key, el){
  const comp=state.data.completions=state.data.completions||{};
  const now=!comp[key]; comp[key]=now;
  el.className="ex"+(now?" on":"");
  updateDay(dayKeyOf(key)); updateProgress();
  if(state.db && state.id){
    state.db.collection("completions").doc(state.id).set({[key]:now},{merge:true}).catch(e=>console.warn("save",e));
  }
}

function renderData(data){
  state.data=data;
  const coach=data.coach||"황서린", brand=data.brand||"퍼스널 트레이닝 랩";
  $("tbPre").textContent=coach+" 코치의"; $("tbNm").textContent=brand;
  document.title=(data.profile?data.profile.name+"님":"나")+"의 트레이닝 기록";
  $("app").innerHTML=`
    <div class="hero">
      <h1>${esc(data.profile?data.profile.name:"회원")}님의 트레이닝 기록 💪</h1>
      <div class="chips">
        <span class="pill p">🎯 ${esc(data.profile?data.profile.goal:"")}</span>
        <span class="pill">${esc(data.profile?data.profile.level:"")}</span>
        ${data.profile&&data.profile.sex?`<span class="pill">${esc(data.profile.sex)}</span>`:""}
      </div>
    </div>
    <div class="sec"><h2>🏋️ 나의 운동 프로그램</h2>
      <p style="color:var(--dim);font-size:12.5px;margin:-6px 0 12px;">운동을 하나씩 하고 동그라미를 눌러 체크하세요. 그날 운동을 다 하면 자동으로 "오늘 운동 끝!"이 떠요 🎉</p>
      ${programHTML(data.program)}</div>
    <div class="sec"><h2>📋 진행 기록</h2>${recordsHTML(data.records)}
      <div class="disc">⚠️ 운동·건강 정보는 일반적인 참고용이며 의료적 조언이 아니에요. 통증이 있으면 무리하지 말고 ${esc(coach)} 코치님이나 전문의와 상담하세요.</div>
    </div>`;
  updateProgress();
}
function renderState(icon,title,desc){
  $("app").innerHTML=`<div class="state"><div class="big">${icon}</div><h2>${esc(title)}</h2><p>${esc(desc)}</p></div>`;
}

async function load(){
  if(qp("demo")==="1"){ state.id=null; state.db=null; renderData(DEMO); return; }
  const id=qp("id"); state.id=id;
  if(!id){ renderState("🔗","링크를 확인해 주세요","올바른 개인 링크로 접속해 주세요."); return; }
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||!window.firebase){ renderState("⚙️","아직 준비 중이에요","코치님이 포털을 설정하면 여기에서 기록을 볼 수 있어요."); return; }
  try{
    firebase.initializeApp(cfg); state.db=firebase.firestore();
    const [snap, csnap] = await Promise.all([
      state.db.collection("clients").doc(id).get(),
      state.db.collection("completions").doc(id).get()
    ]);
    if(!snap.exists){ renderState("🔍","기록을 찾지 못했어요","링크가 정확한지 코치님께 확인해 주세요."); return; }
    const data=snap.data(); data.completions = csnap.exists ? csnap.data() : {};
    renderData(data);
  }catch(e){ console.warn(e); renderState("⚠️","불러오지 못했어요","잠시 후 다시 시도하거나 코치님께 문의해 주세요."); }
}
load();
</script>
</body></html>
